<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FiveM Team - Support Log</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0f0f12;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .wrapper {
            width: 100%;
            max-width: 550px;
            background: #17171c;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            border: 1px solid #ff4444; /* FiveM Rot/Orange-Vibe */
        }
        h1 {
            text-align: center;
            color: #ff4444;
            margin-bottom: 10px;
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        p.subtitle {
            text-align: center;
            color: #a0aec0;
            font-size: 0.9rem;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-weight: 600;
            font-size: 0.9rem;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            background-color: #202027;
            border: 1px solid #3f3f46;
            border-radius: 6px;
            color: #fff;
            font-size: 1rem;
            transition: border-color 0.2s;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #ff4444;
        }
        textarea {
            resize: vertical;
            height: 100px;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #ff4444;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: background-color 0.2s, transform 0.1s;
        }
        button:hover {
            background-color: #ff2222;
        }
        button:active {
            transform: scale(0.98);
        }
        .status-msg {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
            display: none;
        }
    </style>
</head>
<body>

<div class="wrapper">
    <h1>FiveM Support-Log</h1>
    <p class="subtitle">Trage hier deine abgeschlossenen Tickets für die Teamleitung ein.</p>
    
    <form id="supportForm">
        <div class="form-group">
            <label for="teamler">Dein Discord-Name & ID</label>
            <input type="text" id="teamler" placeholder="z.B. MaxMustermann#1234" required>
        </div>

        <div class="form-group">
            <label for="ticketId">Ticket-Nummer / ID</label>
            <input type="text" id="ticketId" placeholder="z.B. #0815" required>
        </div>

        <div class="form-group">
            <label for="art">Art des Vergehens / Supports</label>
            <select id="art" required>
                <option value="" disabled selected>Bitte wählen...</option>
                <option value="RDM / VDM">RDM / VDM</option>
                <option value="Fail-RP / Power-RP">Fail-RP / Power-RP</option>
                <option value="Combat Logging">Combat Logging</option>
                <option value="Erstattung / IC-Hilfe">Erstattung / IC-Hilfe</option>
                <option value="Sonstiges">Sonstiges (Siehe Beschreibung)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="beschreibung">Kurze Beschreibung (Was wurde gemacht?)</label>
            <textarea id="beschreibung" placeholder="Spieler ID 44 hat RDM begangen, Situation geklärt..." required></textarea>
        </div>

        <div class="form-group">
            <label for="strafe">Sanktion / Ergebnis</label>
            <select id="strafe" required>
                <option value="" disabled selected>Bitte wählen...</option>
                <option value="Mündliche Verwarnung">Mündliche Verwarnung</option>
                <option value="Schriftliche Verwarnung">Schriftliche Verwarnung</option>
                <option value="Temporärer Ban">Temporärer Ban</option>
                <option value="Permanenter Ban">Permanenter Ban</option>
                <option value="Erfolgreich geklärt (Keine Strafe)">Erfolgreich geklärt (Keine Strafe)</option>
            </select>
        </div>

        <button type="submit" id="submitBtn">Eintrag absenden</button>
    </form>
    
    <div id="statusMsg" class="status-msg"></div>
</div>

<script>
    // ⚠️ HIER DEINEN DISCORD WEBHOOK LINK ZWISCHEN DIE ANFÜHRUNGSZEICHEN EINFÜGEN!
    const DISCORD_WEBHOOK_URL = "HIER_DEINEN_WEBHOOK_LINK_EINFÜGEN";

    document.getElementById('supportForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const submitBtn = document.getElementById('submitBtn');
        const statusMsg = document.getElementById('statusMsg');
        
        submitBtn.disabled = true;
        submitBtn.innerText = "Wird gesendet...";

        // Daten aus dem Formular auslesen
        const teamler = document.getElementById('teamler').value;
        const ticketId = document.getElementById('ticketId').value;
        const art = document.getElementById('art').value;
        const beschreibung = document.getElementById('beschreibung').value;
        const strafe = document.getElementById('strafe').value;

        // Discord Embed Nachricht bauen
        const requestBody = {
            embeds: [{
                title: "🔴 NEUER SUPPORT-EINTRAG",
                color: 16728132, // FiveM Rot Code
                fields: [
                    { name: "👤 Supporter:", value: teamler, inline: true },
                    { name: "🎫 Ticket-ID:", value: ticketId, inline: true },
                    { name: "📂 Art des Supports:", value: art, inline: false },
                    { name: "📝 Beschreibung:", value: beschreibung, inline: false },
                    { name: "⚖️ Ergebnis / Strafe:", value: strafe, inline: false }
                ],
                footer: { text: "FiveM Server Log System" },
                timestamp: new Date().toISOString()
            }]
        };

        // Per Webhook an Discord senden
        fetch(DISCORD_WEBHOOK_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(requestBody)
        })
        .then(response => {
            if (response.ok) {
                statusMsg.style.color = "#4ade80";
                statusMsg.innerText = "✅ Eintrag erfolgreich an Discord gesendet!";
                statusMsg.style.display = "block";
                document.getElementById('supportForm').reset();
            } else {
                throw new Error();
            }
        })
        .catch(() => {
            statusMsg.style.color = "#f87171";
            statusMsg.innerText = "❌ Fehler beim Senden. Webhook-URL geprüft?";
            statusMsg.style.display = "block";
        })
        .finally(() => {
            submitBtn.disabled = false;
            submitBtn.innerText = "Eintrag absenden";
        });
    });
</script>

</body>
</html>
