<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Management Zentrale</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --border-color: #334155;
            --danger-color: #ef4444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        h1, h2 {
            margin: 0 0 15px 0;
            color: #93c5fd;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 1024px) {
            .container {
                grid-template-columns: 1fr 1fr;
            }
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .tb-section {
            grid-column: 1 / -1;
        }

        textarea {
            width: 100%;
            height: 150px;
            background-color: #0f172a;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px;
            font-family: inherit;
            resize: vertical;
            box-sizing: border-box;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"], select {
            width: 100%;
            padding: 10px;
            background-color: #0f172a;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .log-list {
            max-height: 300px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }

        .log-item {
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 6px;
            font-size: 0.9em;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-badge {
            font-size: 0.8em;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
        }

        .status-banned { background-color: #7f1d1d; color: #fca5a5; }
        .status-ausreisen { background-color: #365314; color: #bef264; }
    </style>
</head>
<body>

    <h1>Management Zentrale</h1>

    <div class="container">
        <!-- Live TB Textfeld mit Speicherung -->
        <div class="card tb-section">
            <h2>Live TB Notizen</h2>
            <textarea id="tbField" placeholder="Schreibe hier wichtige TB-Notizen rein... (wird automatisch gespeichert)"></textarea>
        </div>

        <!-- Sektion: Banned -->
        <div class="card">
            <h2>Banned Log</h2>
            <div class="form-group">
                <input type="text" id="bannedUser" placeholder="Spieler / Name">
                <input type="text" id="bannedReason" placeholder="Grund für Banned">
                <button onclick="addLog('banned')">Eintrag Hinzufügen</button>
            </div>
            <div class="log-list" id="bannedList"></div>
        </div>

        <!-- Sektion: Ausreisen -->
        <div class="card">
            <h2>Ausreisen Log</h2>
            <div class="form-group">
                <input type="text" id="ausreisenUser" placeholder="Spieler / Name">
                <input type="text" id="ausreisenReason" placeholder="Grund für Ausreisen">
                <button onclick="addLog('ausreisen')">Eintrag Hinzufügen</button>
            </div>
            <div class="log-list" id="ausreisenList"></div>
        </div>
    </div>

    <script>
        // TB-Feld automatisches Speichern & Laden
        const tbField = document.getElementById('tbField');

        // Beim Laden der Seite alten Inhalt holen
        window.addEventListener('DOMContentLoaded', () => {
            const savedTB = localStorage.getItem('tb_notes');
            if (savedTB) {
                tbField.value = savedTB;
            }
            loadLogs();
        });

        // Bei jeder Eingabe sofort speichern
        tbField.addEventListener('input', () => {
            localStorage.setItem('tb_notes', tbField.value);
        });

        // Log-Einträge verwalten
        function addLog(type) {
            let userInput, reasonInput, storageKey;

            if (type === 'banned') {
                userInput = document.getElementById('bannedUser');
                reasonInput = document.getElementById('bannedReason');
                storageKey = 'logs_banned';
            } else if (type === 'ausreisen') {
                userInput = document.getElementById('ausreisenUser');
                reasonInput = document.getElementById('ausreisenReason');
                storageKey = 'logs_ausreisen';
            }

            const user = userInput.value.trim();
            const reason = reasonInput.value.trim();

            if (!user) {
                alert('Bitte einen Namen eingeben!');
                return;
            }

            const newEntry = {
                user: user,
                reason: reason || 'Kein Grund angegeben',
                date: new Date().toLocaleString('de-DE')
            };

            const existingLogs = JSON.parse(localStorage.getItem(storageKey) || '[]');
            existingLogs.unshift(newEntry);
            localStorage.setItem(storageKey, JSON.stringify(existingLogs));

            userInput.value = '';
            reasonInput.value = '';

            loadLogs();
        }

        function loadLogs() {
            renderList('bannedList', 'logs_banned', 'status-banned', 'BANNED');
            renderList('ausreisenList', 'logs_ausreisen', 'status-ausreisen', 'AUSREISEN');
        }

        function renderList(elementId, storageKey, badgeClass, labelText) {
            const listElement = document.getElementById(elementId);
            const logs = JSON.parse(localStorage.getItem(storageKey) || '[]');
            
            listElement.innerHTML = '';
            
            logs.forEach((log) => {
                const item = document.createElement('div');
                item.className = 'log-item';
                item.innerHTML = `
                    <div>
                        <strong>${log.user}</strong> - ${log.reason}
                        <br><small style="color: #64748b;">${log.date}</small>
                    </div>
                    <span class="status-badge ${badgeClass}">${labelText}</span>
                `;
                listElement.appendChild(item);
            });
        }
    </script>
</body>
</html>
